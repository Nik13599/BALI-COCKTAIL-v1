name: Generate final default ingredient visuals

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/generate-default-ingredient-visuals-final.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Pillow
        run: python3 -m pip install --quiet pillow
      - name: Generate transparent ingredient visuals where missing
        run: |
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path
          import json, hashlib, datetime, os
          root=Path('.')
          ip=root/'data'/'ingredients.json'
          ingredients=json.loads(ip.read_text(encoding='utf-8'))
          out=root/'images'/'ingredients'/'default'; out.mkdir(parents=True,exist_ok=True)
          def F(n,b=False):
              for p in [('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf' if b else '/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'),('/usr/share/fonts/truetype/liberation2/LiberationSans-Bold.ttf' if b else '/usr/share/fonts/truetype/liberation2/LiberationSans-Regular.ttf')]:
                  if os.path.exists(p): return ImageFont.truetype(p,n)
              return ImageFont.load_default()
          f15=F(15,True)
          def wrap(d,t,maxw):
              out=[]; cur=''
              for word in str(t).split():
                  s=(cur+' '+word).strip()
                  if d.textbbox((0,0),s,font=f15)[2]<=maxw: cur=s
                  else:
                      if cur: out.append(cur)
                      cur=word
              if cur: out.append(cur)
              return out[:3]
          def palette(n):
              n=n.lower().replace('ё','е')
              if any(x in n for x in ['малина','клюква','вишн','кампари','наршараб','томат']): return (155,26,50,255),(245,218,224,255)
              if any(x in n for x in ['аперол','апельс','ананас','персик','маракуй','карамел','виски','ром','текил']): return (205,88,22,255),(255,235,208,255)
              if any(x in n for x in ['киви','базилик','мята','яблок','алоэ','фисташ','лайм']): return (58,120,62,255),(225,244,225,255)
              if any(x in n for x in ['кокос','сливк','молоч','сахар','водка','джин','содовая','вода']): return (210,216,221,235),(38,44,52,255)
              return (92,57,40,255),(245,232,218,255)
          def kind(n):
              s=n.lower().replace('ё','е')
              if any(x in s for x in ['грейпфрут','малина','клюква','апельсин','базилик','мята','чили','цедра','кокосовая стружка','бадьян','корица','кардамон','гвоздика','перец горошек']): return 'natural'
              if any(x in s for x in ['сахар песок','сахар тростниковый']): return 'dry'
              if any(x in s for x in ['пюре','наршараб','соус кимчи','соус соевый','кофе эспрессо']): return 'jar'
              return 'bottle'
          def create(item,target):
              name=item.get('name','Ингредиент'); main,light=palette(name); k=kind(name)
              im=Image.new('RGBA',(320,320),(0,0,0,0)); d=ImageDraw.Draw(im)
              d.ellipse((62,278,258,296),fill=(0,0,0,34))
              if k=='bottle':
                  d.rounded_rectangle((104,62,216,274),24,fill=main,outline=(235,235,235,170),width=3); d.rounded_rectangle((127,24,193,78),12,fill=main,outline=(235,235,235,170),width=3); d.rectangle((132,10,188,34),fill=(28,28,30,255)); d.rounded_rectangle((116,118,204,218),10,fill=(248,246,240,242),outline=(40,40,40,180),width=2); d.line((120,76,120,112),fill=(255,255,255,95),width=5); lines=wrap(d,name.replace('“','').replace('”',''),78); y=132
                  for line in lines: bb=d.textbbox((0,0),line,font=f15); d.text(((320-(bb[2]-bb[0]))/2,y),line,font=f15,fill=(20,20,22,255)); y+=20
              elif k=='jar':
                  d.rounded_rectangle((72,118,248,266),28,fill=main,outline=(235,235,235,170),width=3); d.rounded_rectangle((86,88,234,132),12,fill=(48,48,50,255)); d.rounded_rectangle((88,158,232,232),12,fill=(248,246,240,238),outline=(50,50,50,160),width=2); lines=wrap(d,name,128); y=170
                  for line in lines: bb=d.textbbox((0,0),line,font=f15); d.text(((320-(bb[2]-bb[0]))/2,y),line,font=f15,fill=(20,20,22,255)); y+=20
              elif k=='dry':
                  d.ellipse((72,132,248,266),fill=(40,40,42,255)); d.polygon([(95,200),(160,86),(225,200)],fill=light,outline=(255,255,255,120)); lines=wrap(d,name,210); y=236
                  for line in lines: bb=d.textbbox((0,0),line,font=f15); d.text(((320-(bb[2]-bb[0]))/2,y),line,font=f15,fill=(248,248,248,255)); y+=18
              else:
                  d.ellipse((86,90,234,238),fill=main,outline=(255,255,255,160),width=3); d.ellipse((55,150,145,238),fill=light,outline=(255,255,255,150),width=2); d.ellipse((178,154,265,238),fill=light,outline=(255,255,255,150),width=2); d.polygon([(148,95),(116,46),(154,58)],fill=(44,113,54,255)); d.polygon([(172,94),(211,45),(177,58)],fill=(49,126,57,255)); lines=wrap(d,name,250); y=247
                  for line in lines: bb=d.textbbox((0,0),line,font=f15); d.text(((320-(bb[2]-bb[0]))/2,y),line,font=f15,fill=(248,248,248,255),stroke_width=2,stroke_fill=(0,0,0,150)); y+=18
              im.save(target,'PNG',optimize=True)
          changed=False; gen=0; kept=0
          for item in ingredients:
              cur=item.get('officialImage') or ''
              if cur and (root/cur).is_file(): kept+=1; continue
              fn='ingredient-'+hashlib.sha1(str(item.get('id') or item.get('name')).encode()).hexdigest()[:12]+'.png'
              rel='images/ingredients/default/'+fn; create(item,root/rel); item['officialImage']=rel; item['imageSource']='BALI default visual; administrator can replace'; gen+=1; changed=True
          if changed:
              ip.write_text(json.dumps(ingredients,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              mp=root/'data'/'manifest.json'; m=json.loads(mp.read_text(encoding='utf-8')); m['catalogVersion']=int(m.get('catalogVersion',0))+1; m['updatedAt']=datetime.datetime.now(datetime.timezone.utc).isoformat().replace('+00:00','Z'); mp.write_text(json.dumps(m,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('generated',gen,'kept',kept,'total',len(ingredients))
          PY
      - name: Rebase and commit visuals
        run: |
          if git status --porcelain | grep -q .; then
            git config user.name "BALI COCKTAIL automation"
            git config user.email "actions@users.noreply.github.com"
            git add data/ingredients.json data/manifest.json images/ingredients/default
            git commit -m "Add default visuals for all ingredients"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "All ingredient visuals are already present"
          fi
