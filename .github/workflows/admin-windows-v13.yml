name: Build BALI COCKTAIL ADMIN v1.3 Windows

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/admin-windows-v13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare Windows icon if needed
        shell: pwsh
        run: |
          if (Test-Path 'admin/icon.ico') {
            Write-Host 'Using committed admin/icon.ico'
            exit 0
          }
          $candidates = @(
            'web-template/icon.png',
            'web-template/app-icon.png',
            'web-template/assets/icon.png',
            'assets/icon.png',
            'assets/app-icon.png'
          )
          $source = $null
          foreach ($p in $candidates) { if (Test-Path $p) { $source = $p; break } }
          if (-not $source) {
            $source = (Get-ChildItem -Path . -Recurse -File -Include *.png | Where-Object { $_.Name -match 'icon|logo' } | Select-Object -First 1).FullName
          }
          if (-not $source) { throw 'No PNG icon source found in repository' }
          Write-Host "Using PNG source: $source"
          npm install --no-save png-to-ico@2.1.8
          $env:ICON_SOURCE = $source
          @'
          const fs=require('fs');
          const pngToIco=require('png-to-ico');
          (async()=>{
            const out=await pngToIco(process.env.ICON_SOURCE);
            fs.writeFileSync('admin/icon.ico',out);
          })().catch(e=>{console.error(e);process.exit(1)});
          '@ | Set-Content -Encoding UTF8 make-icon.js
          node make-icon.js
      - name: Validate admin JavaScript
        working-directory: admin
        run: |
          node --check print-tools.js
          node --check bar-menu.js
          node --check products-a4.js
          node --check document-print.js
          node --check publish-fix.js
      - name: Install dependencies
        working-directory: admin
        run: npm install
      - name: Build portable EXE
        working-directory: admin
        run: npm run dist
      - name: Collect executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe = Get-ChildItem -Path admin/dist -Filter '*.exe' -File | Select-Object -First 1
          if (-not $exe) { throw 'Windows executable not found' }
          Copy-Item $exe.FullName 'out/BALI-COCKTAIL-ADMIN-v1.3.exe'
      - name: Upload Windows admin
        uses: actions/upload-artifact@v4
        with:
          name: BALI-COCKTAIL-ADMIN-v1.3-Windows
          path: out/BALI-COCKTAIL-ADMIN-v1.3.exe
          if-no-files-found: error
          retention-days: 30
