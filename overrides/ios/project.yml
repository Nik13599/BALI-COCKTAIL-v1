name: BALI_COCKTAIL
options:
  bundleIdPrefix: by.bali
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    PRODUCT_NAME: "BALI COCKTAIL"
targets:
  BALI_COCKTAIL:
    type: application
    platform: iOS
    sources:
      - path: BALI_COCKTAIL
        excludes:
          - README.md
    resources:
      - path: BALI_COCKTAIL/Assets.xcassets
      - path: BALI_COCKTAIL/cocktails.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: by.bali.cocktails
        INFOPLIST_KEY_CFBundleDisplayName: "BALI COCKTAIL"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "BALI COCKTAIL использует камеру, чтобы вы могли сфотографировать готовый коктейль и сохранить фото только на этом iPhone."
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SWIFT_VERSION: 5.0
