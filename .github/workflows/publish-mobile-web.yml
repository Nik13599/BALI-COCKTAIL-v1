name: Build BALI COCKTAIL iPhone FIXED Profile

on:
  push:
    branches: [main]
    paths:
      - 'web-template/**'
      - 'branding/app-icon.png'
      - '.github/workflows/publish-mobile-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify public iPhone launcher renders as HTML
        shell: bash
        run: |
          set -euo pipefail
          APP_URL="https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-cocktail-iphone/mYLMPT6khtrtYzlxwG2aA2w-CzdWWpC8/"
          SW_URL="${APP_URL}sw.js"
          rm -f /tmp/bali-headers /tmp/bali-body /tmp/bali-sw-headers /tmp/bali-sw

          status="$(curl -sS --max-time 30 -D /tmp/bali-headers -o /tmp/bali-body -w '%{http_code}' "$APP_URL")"
          cat /tmp/bali-headers
          test "$status" = "200"
          tr -d '\r' < /tmp/bali-headers | grep -Eiq '^content-type:[[:space:]]*text/html([;[:space:]]|$)'
          grep -Fq 'BALI COCKTAIL' /tmp/bali-body
          grep -Eiq '<!doctype html' /tmp/bali-body

          sw_status="$(curl -sS --max-time 30 -D /tmp/bali-sw-headers -o /tmp/bali-sw -w '%{http_code}' "$SW_URL")"
          cat /tmp/bali-sw-headers
          test "$sw_status" = "200"
          tr -d '\r' < /tmp/bali-sw-headers | grep -Eiq '^content-type:[[:space:]]*(application/javascript|text/javascript)([;[:space:]]|$)'
          grep -Fq 'bali-cocktail-iphone-core-v16' /tmp/bali-sw

      - name: Build iPhone installation profile with exact BALI icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          sips -z 180 180 branding/app-icon.png --out /tmp/bali-180.png >/dev/null
          python3 - <<'PY'
          import plistlib,uuid
          from pathlib import Path
          app_url='https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-cocktail-iphone/mYLMPT6khtrtYzlxwG2aA2w-CzdWWpC8/'
          icon=Path('/tmp/bali-180.png').read_bytes()
          clip={
              'PayloadType':'com.apple.webClip.managed',
              'PayloadVersion':1,
              'PayloadIdentifier':'by.bali.cocktail.v1.webclip.offline.v16',
              'PayloadUUID':str(uuid.uuid4()).upper(),
              'PayloadDisplayName':'BALI COCKTAIL',
              'PayloadDescription':'BALI COCKTAIL iPhone offline-first',
              'Label':'BALI COCKTAIL',
              'URL':app_url,
              'IsRemovable':True,
              'Precomposed':True,
              'FullScreen':True,
              'IgnoreManifestScope':True,
              'Icon':icon,
          }
          profile={
              'PayloadType':'Configuration',
              'PayloadVersion':1,
              'PayloadIdentifier':'by.bali.cocktail.v1.profile.offline.v16',
              'PayloadUUID':str(uuid.uuid4()).upper(),
              'PayloadDisplayName':'BALI COCKTAIL',
              'PayloadDescription':'Исправленная iPhone-версия BALI COCKTAIL. HTML открывается как приложение; каталог и фотографии сохраняются локально после первой синхронизации.',
              'PayloadOrganization':'BALI',
              'PayloadRemovalDisallowed':False,
              'PayloadContent':[clip],
          }
          with open('out/BALI-COCKTAIL-iPhone-FIXED-v16.mobileconfig','wb') as f:
              plistlib.dump(profile,f,fmt=plistlib.FMT_XML,sort_keys=False)
          PY
          plutil -lint out/BALI-COCKTAIL-iPhone-FIXED-v16.mobileconfig

      - uses: actions/upload-artifact@v4
        with:
          name: BALI-COCKTAIL-iPhone-FIXED-v16
          path: out/BALI-COCKTAIL-iPhone-FIXED-v16.mobileconfig
          if-no-files-found: error
          retention-days: 30
