name: Release BALI COCKTAIL ADMIN v1.3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-admin-v13.yml'
      - 'admin/**'
      - 'mobile-admin/icon.b64'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare exact BALI Windows icon
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          @'
          from pathlib import Path
          import base64
          from PIL import Image
          raw=''.join(Path('mobile-admin/icon.b64').read_text(encoding='utf-8-sig').split())
          Path('admin/icon-source.jpg').write_bytes(base64.b64decode(raw))
          im=Image.open('admin/icon-source.jpg').convert('RGBA').resize((256,256),Image.Resampling.LANCZOS)
          im.save('admin/icon.ico',format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding utf8 icon.py
          python icon.py
      - name: Validate JavaScript
        working-directory: admin
        run: |
          node --check v13-core.js
          node --check products.js
          node --check print-tools.js
          node --check publish-fix.js
          node --check main.js
      - name: Build Windows portable admin
        working-directory: admin
        run: |
          npm install
          npm run dist
      - name: Prepare release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe=Get-ChildItem admin/dist -Filter '*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if(-not $exe){throw 'EXE not found'}
          Copy-Item $exe.FullName 'out/BALI-COCKTAIL-ADMIN-v1.3.exe'
          Remove-Item -Recurse -Force browser -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path browser/BALI-COCKTAIL-ADMIN | Out-Null
          Copy-Item admin/index.html,admin/v13-core.js,admin/products.js,admin/print-tools.js,admin/publish-fix.js browser/BALI-COCKTAIL-ADMIN/
          Set-Content browser/BALI-COCKTAIL-ADMIN/README.txt -Encoding UTF8 -Value @('BALI COCKTAIL ADMIN v1.3','Откройте index.html в Chrome или Edge.','Публикация использует GitHub Contents API. При 403 старый token очищается и приложение просит переподключить token с Contents: Read and write.')
          $p='browser/BALI-COCKTAIL-ADMIN/index.html';$s=Get-Content $p -Raw
          if($s -notmatch 'publish-fix\.js'){$inject="<script src=`"v13-core.js`"></script>`n<script src=`"products.js`"></script>`n<script src=`"print-tools.js`"></script>`n<script src=`"publish-fix.js`"></script>`n";$s=$s.Replace('</body>',$inject+'</body>');Set-Content $p -Value $s -Encoding UTF8}
          Compress-Archive -Path browser/BALI-COCKTAIL-ADMIN -DestinationPath out/BALI-COCKTAIL-ADMIN-v1.3-Browser.zip -Force
      - name: Publish stable release assets
        shell: pwsh
        env: {GH_TOKEN: '${{ github.token }}'}
        run: |
          gh release view admin-v1.3 *> $null
          if($LASTEXITCODE -ne 0){gh release create admin-v1.3 --title 'BALI COCKTAIL ADMIN v1.3' --notes 'BALI COCKTAIL ADMIN with unified icon, product catalogue, tech cards and fixed GitHub Contents publishing.' --target main}
          gh release upload admin-v1.3 out/BALI-COCKTAIL-ADMIN-v1.3.exe out/BALI-COCKTAIL-ADMIN-v1.3-Browser.zip --clobber
      - uses: actions/upload-artifact@v4
        with:
          name: BALI-COCKTAIL-ADMIN-v1.3-Release
          path: |
            out/BALI-COCKTAIL-ADMIN-v1.3.exe
            out/BALI-COCKTAIL-ADMIN-v1.3-Browser.zip
          if-no-files-found: error
          retention-days: 30
