<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="BALI COCKTAIL"><meta name="theme-color" content="#0b0b0d"><title>BALI COCKTAIL</title><style>html,body{margin:0;background:#0b0b0d;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;min-height:100%}.boot{min-height:100vh;display:grid;place-items:center;padding:28px;box-sizing:border-box;text-align:center}.logo{font-size:28px;font-weight:900;letter-spacing:-.6px}.status{margin-top:10px;color:#aaa;font-size:13px;line-height:1.4}.retry{margin-top:18px;border:0;border-radius:12px;padding:11px 16px;background:#8e2948;color:#fff;font-weight:800;display:none}</style></head><body><div class="boot"><div><div class="logo">BALI COCKTAIL</div><div id="status" class="status">Загрузка каталога…</div><button id="retry" class="retry" onclick="location.reload()">Повторить</button></div></div><script>(async()=>{const RAW='https://raw.githubusercontent.com/Nik13599/BALI-COCKTAIL-v1/main/web-template/';const CACHE='bali-cocktail-shell-v21';const names=['index.html','ingredient-zoom.js','readonly-mobile.js','sort-alpha.js','sync-repair.js'];const status=document.getElementById('status');const retry=document.getElementById('retry');function inline(code){return '<script>'+code.replace(/<\/script/gi,'<\\/script')+'<\/script>'}function prepare(parts){let h=parts[0];if(!/<base\s/i.test(h))h=h.replace(/<head([^>]*)>/i,'<head$1><base href="'+RAW+'">');const extras=parts.slice(1).map(inline).join('')+inline("if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}");return h.replace(/<\/body>/i,extras+'</body>')}function show(h){document.open();document.write(h);document.close()}try{const rs=await Promise.all(names.map(n=>fetch(RAW+n+'?v=21',{cache:'no-store'})));for(let i=0;i<rs.length;i++){if(!rs[i].ok)throw new Error(names[i]+' HTTP '+rs[i].status)}const parts=await Promise.all(rs.map(r=>r.text()));const html=prepare(parts);try{localStorage.setItem(CACHE,html)}catch(_){}show(html)}catch(e){const saved=localStorage.getItem(CACHE);if(saved){status.textContent='Офлайн · запуск сохранённой версии';setTimeout(()=>show(saved),50);return}status.textContent='Не удалось загрузить приложение. Проверьте интернет.';retry.style.display='inline-block'}})();</script></body></html>
