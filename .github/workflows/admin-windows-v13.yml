name: Build BALI COCKTAIL ADMIN v1.3 Windows

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'branding/app-icon.png'
      - '.github/workflows/admin-windows-v13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Prepare exact BALI Windows icon
        shell: pwsh
        run: |
          python -m pip install --quiet pillow
          @'
          from PIL import Image
          im=Image.open('branding/app-icon.png').convert('RGBA').resize((256,256),Image.Resampling.LANCZOS)
          im.save('admin/icon.ico',format='ICO',sizes=[(16,16),(24,24),(32,32),(48,48),(64,64),(128,128),(256,256)])
          '@ | Set-Content -Encoding utf8 icon.py
          python icon.py
          if (-not (Test-Path 'admin/icon.ico')) { throw 'BALI icon was not generated' }
      - name: Validate admin JavaScript
        working-directory: admin
        run: |
          node --check v13-core.js
          node --check products.js
          node --check print-tools.js
          node --check print-bartender-tweaks.js
          node --check publish-fix.js
          node --check main.js
      - name: Install dependencies
        working-directory: admin
        run: npm install
      - name: Build portable EXE
        working-directory: admin
        run: npm run dist
      - name: Collect and verify executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          $exe=Get-ChildItem admin/dist -Filter '*.exe' -File | Sort-Object Length -Descending | Select-Object -First 1
          if (-not $exe) { throw 'Windows executable not found' }
          Copy-Item $exe.FullName 'out/BALI-COCKTAIL-ADMIN-v1.3.exe'
          $bytes=[IO.File]::ReadAllBytes('out/BALI-COCKTAIL-ADMIN-v1.3.exe')
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Invalid EXE' }
      - uses: actions/upload-artifact@v4
        with: {name: BALI-COCKTAIL-ADMIN-v1.3-Windows, path: out/BALI-COCKTAIL-ADMIN-v1.3.exe, if-no-files-found: error, retention-days: 30}
