name: Build BALI COCKTAIL Android FINAL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/user-android-final.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate application sources
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/bootstrap.part.* > /tmp/bootstrap.sh
          chmod +x /tmp/bootstrap.sh
          /tmp/bootstrap.sh generated
          chmod +x scripts/apply-overrides.sh
          scripts/apply-overrides.sh generated
          mkdir -p generated/android/app/src/main/res/drawable
          rm -f generated/android/app/src/main/res/drawable/ic_launcher.*
          cp branding/app-icon.png generated/android/app/src/main/res/drawable/ic_launcher.png
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/cache@v4
        with: {path: ~/.android/debug.keystore, key: bali-cocktail-v1-debug-keystore}
      - name: Create signing key when missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=BALI,C=BY" -keyalg RSA -keysize 2048 -validity 10000; fi
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.1.0'}
      - name: Build and verify APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p generated/android :app:assembleDebug --stacktrace
          APK=generated/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" > /tmp/files.txt
          grep -q 'assets/cocktails.json' /tmp/files.txt
          mkdir -p out
          cp "$APK" out/BALI-COCKTAIL-Android-FINAL.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BALI-COCKTAIL-Android-FINAL
          path: out/BALI-COCKTAIL-Android-FINAL.apk
          if-no-files-found: error
          retention-days: 30
