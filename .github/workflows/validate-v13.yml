name: Validate BALI COCKTAIL v1.3

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - 'data/ingredients.json'
      - 'data/manifest.json'
      - 'images/ingredients/default/**'
      - '.github/workflows/validate-v13.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate admin JavaScript
        run: |
          node --check admin/print-tools.js
          node --check admin/bar-menu.js
          node --check admin/products-a4.js
          node --check admin/document-print.js
          node --check admin/publish-fix.js
      - name: Validate default ingredient images and mappings
        run: |
          python3 - <<'PY'
          import json, os
          p='data/ingredients.json'
          data=json.load(open(p,encoding='utf-8'))
          assert data, 'ingredients.json is empty'
          missing=[]
          for item in data:
              image=item.get('officialImage')
              if not image:
                  missing.append(item.get('name'))
                  continue
              if image.startswith('images/ingredients/default/') and not os.path.isfile(image):
                  raise SystemExit(f'Missing image file: {image}')
          print('ingredients:',len(data),'without default image:',len(missing))
          if missing:
              print('NO_IMAGE:', *missing, sep='\n')
          PY
      - name: Validate Windows icon
        run: test -f admin/icon.ico
