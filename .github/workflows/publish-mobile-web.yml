name: Build BALI COCKTAIL iPhone FIXED Profile

on:
  push:
    branches: [main]
    paths:
      - 'web-template/**'
      - 'branding/app-icon.png'
      - '.github/workflows/publish-mobile-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify iPhone launcher is rendered, not shown as HTML source
        shell: bash
        run: |
          set -euo pipefail
          APP_URL="https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-cocktail-iphone?k=mYLMPT6khtrtYzlxwG2aA2w-CzdWWpC8"
          rm -f /tmp/bali-headers /tmp/bali-body
          status="$(curl -sS --max-time 30 -D /tmp/bali-headers -o /tmp/bali-body -w '%{http_code}' "$APP_URL")"
          cat /tmp/bali-headers
          test "$status" = "200"
          tr -d '\r' < /tmp/bali-headers | grep -Eiq '^content-type:[[:space:]]*image/svg\+xml([;[:space:]]|$)'
          grep -Fq 'BALI COCKTAIL' /tmp/bali-body
          grep -Fq 'window.location.replace(URL.createObjectURL(b))' /tmp/bali-body
          if tr -d '\r' < /tmp/bali-headers | grep -Eiq '^content-type:[[:space:]]*text/plain'; then
            echo "Launcher is still plain text"
            exit 1
          fi

      - name: Build iPhone installation profile with exact BALI icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          sips -z 180 180 branding/app-icon.png --out /tmp/bali-180.png >/dev/null
          python3 - <<'PY'
          import plistlib,uuid
          from pathlib import Path
          app_url='https://mvnxfouyoynqyjdpcblh.supabase.co/functions/v1/bali-cocktail-iphone?k=mYLMPT6khtrtYzlxwG2aA2w-CzdWWpC8'
          icon=Path('/tmp/bali-180.png').read_bytes()
          clip={
              'PayloadType':'com.apple.webClip.managed',
              'PayloadVersion':1,
              'PayloadIdentifier':'by.bali.cocktail.v1.webclip.fixed.v17',
              'PayloadUUID':str(uuid.uuid4()).upper(),
              'PayloadDisplayName':'BALI COCKTAIL',
              'PayloadDescription':'BALI COCKTAIL iPhone launcher v17',
              'Label':'BALI COCKTAIL',
              'URL':app_url,
              'IsRemovable':True,
              'Precomposed':True,
              'FullScreen':True,
              'Icon':icon,
          }
          profile={
              'PayloadType':'Configuration',
              'PayloadVersion':1,
              'PayloadIdentifier':'by.bali.cocktail.v1.profile.fixed.v17',
              'PayloadUUID':str(uuid.uuid4()).upper(),
              'PayloadDisplayName':'BALI COCKTAIL',
              'PayloadDescription':'Исправленная версия для iPhone: вместо исходного HTML-кода запускается интерфейс BALI COCKTAIL. После успешной загрузки оболочка сохраняется на устройстве.',
              'PayloadOrganization':'BALI',
              'PayloadRemovalDisallowed':False,
              'PayloadContent':[clip],
          }
          with open('out/BALI-COCKTAIL-iPhone-FIXED-v17.mobileconfig','wb') as f:
              plistlib.dump(profile,f,fmt=plistlib.FMT_XML,sort_keys=False)
          PY
          plutil -lint out/BALI-COCKTAIL-iPhone-FIXED-v17.mobileconfig

      - uses: actions/upload-artifact@v4
        with:
          name: BALI-COCKTAIL-iPhone-FIXED-v17
          path: out/BALI-COCKTAIL-iPhone-FIXED-v17.mobileconfig
          if-no-files-found: error
          retention-days: 30
