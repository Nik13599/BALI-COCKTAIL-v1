plugins { id 'com.android.application' }

android {
    namespace 'by.bali.cocktails.admin.mobile'
    compileSdk 36

    defaultConfig {
        applicationId 'by.bali.cocktails.admin.mobile'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging { resources.excludes += ['/META-INF/{AL2.0,LGPL2.1}'] }
}
