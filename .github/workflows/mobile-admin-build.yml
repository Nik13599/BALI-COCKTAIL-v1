name: Build BALI COCKTAIL Mobile ADMIN

on:
  push:
    branches: [main]
    paths:
      - 'mobile-admin/**'
      - 'mobile-admin-android/**'
      - 'mobile-admin-ios/**'
      - 'branding/app-icon.png'
      - '.github/workflows/mobile-admin-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Validate mobile admin v3 editor, icon and profile
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re,xml.etree.ElementTree as ET
          html=Path('mobile-admin/admin-v3.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script>(.*?)</script>',html,re.S); assert scripts
          Path('/tmp/admin-v3.js').write_text(scripts[-1],encoding='utf-8')
          ET.parse('mobile-admin/BALI-COCKTAIL-ADMIN-iPhone.mobileconfig')
          icon=Path('branding/app-icon.png'); assert icon.exists() and icon.stat().st_size > 100000
          for word in ['openEditor','saveCocktail','saveIngredient','saveProduct','editorPage','data/cocktails.json','data/ingredients.json','data/products.json','Contents → Read and write']: assert word in html,word
          assert 'data-amount' in html and 'delete c.ingredients[n].dose' in html
          print('mobile admin v3 structure OK')
          PY
          node --check /tmp/admin-v3.js

  android:
    name: Android ADMIN APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Package editor and exact BALI icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mobile-admin-android/app/src/main/assets/mobile-admin mobile-admin-android/app/src/main/res/drawable
          cp mobile-admin/admin-v3.html mobile-admin/manifest.webmanifest mobile-admin/sw.js mobile-admin-android/app/src/main/assets/mobile-admin/
          cp branding/app-icon.png mobile-admin-android/app/src/main/assets/mobile-admin/app-icon.png
          cp branding/app-icon.png mobile-admin-android/app/src/main/res/drawable/bali_app_icon.png
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/cache@v4
        with: {path: ~/.android/debug.keystore, key: bali-cocktail-mobile-admin-debug-keystore-v3}
      - name: Create signing key when missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=BALI ADMIN,C=BY" -keyalg RSA -keysize 2048 -validity 10000; fi
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.1.0'}
      - name: Build Android admin APK
        run: gradle -p mobile-admin-android :app:assembleDebug --stacktrace
      - name: Verify APK
        shell: bash
        run: |
          APK=mobile-admin-android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" >/tmp/admin-apk.txt
          grep -q 'assets/mobile-admin/admin-v3.html' /tmp/admin-apk.txt
          grep -q 'assets/mobile-admin/app-icon.png' /tmp/admin-apk.txt
          grep -q 'res/drawable/bali_app_icon.png' /tmp/admin-apk.txt
          mkdir -p out
          cp "$APK" out/BALI-COCKTAIL-ADMIN-Android-v3.apk
      - uses: actions/upload-artifact@v4
        with: {name: BALI-COCKTAIL-ADMIN-Android-v3, path: out/BALI-COCKTAIL-ADMIN-Android-v3.apk, if-no-files-found: error, retention-days: 30}
      - name: Emulator smoke test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r mobile-admin-android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n by.bali.cocktails.admin.mobile/.MainActivity
            sleep 4
            adb shell pidof by.bali.cocktails.admin.mobile

  ios:
    name: iPhone ADMIN
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify iPhone ADMIN v3 page is served as HTML from production CDN
        shell: bash
        env: {APP_SHA: '${{ github.sha }}'}
        run: |
          set -euo pipefail
          URL="https://rawcdn.githack.com/Nik13599/BALI-COCKTAIL-v1/${APP_SHA}/mobile-admin/admin-v3.html"
          ok=0
          for attempt in $(seq 1 12); do
            headers="$(curl -fsSI "$URL" 2>/dev/null || true)"
            if printf '%s\n' "$headers" | tr -d '\r' | grep -Eqi '^content-type:[[:space:]]*text/html'; then ok=1; break; fi
            sleep 4
          done
          test "$ok" -eq 1
      - name: Prepare exact BALI app icon
        shell: bash
        run: |
          set -euo pipefail
          A=mobile-admin-ios/BALI_COCKTAIL_ADMIN/Assets.xcassets
          mkdir -p "$A/AppIcon.appiconset"
          printf '%s\n' '{"info":{"author":"xcode","version":1}}' > "$A/Contents.json"
          cp branding/app-icon.png "$A/AppIcon.appiconset/appicon-1024.png"
          sips -z 120 120 "$A/AppIcon.appiconset/appicon-1024.png" --out "$A/AppIcon.appiconset/appicon-120.png" >/dev/null
          sips -z 180 180 "$A/AppIcon.appiconset/appicon-1024.png" --out "$A/AppIcon.appiconset/appicon-180.png" >/dev/null
          cat > "$A/AppIcon.appiconset/Contents.json" <<'JSON'
          {"images":[{"filename":"appicon-120.png","idiom":"iphone","scale":"2x","size":"60x60"},{"filename":"appicon-180.png","idiom":"iphone","scale":"3x","size":"60x60"},{"filename":"appicon-1024.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
      - name: Build iPhone WebClip profile with exact BALI icon
        shell: bash
        env: {APP_SHA: '${{ github.sha }}'}
        run: |
          mkdir -p out/ios
          python3 - <<'PY'
          import plistlib,uuid,os
          from pathlib import Path
          icon=Path('mobile-admin-ios/BALI_COCKTAIL_ADMIN/Assets.xcassets/AppIcon.appiconset/appicon-180.png').read_bytes()
          sha=os.environ['APP_SHA']
          url=f'https://rawcdn.githack.com/Nik13599/BALI-COCKTAIL-v1/{sha}/mobile-admin/admin-v3.html'
          clip={'PayloadType':'com.apple.webClip.managed','PayloadVersion':1,'PayloadIdentifier':'by.bali.cocktails.admin.mobile.webclip.v7','PayloadUUID':str(uuid.uuid4()).upper(),'PayloadDisplayName':'BALI COCKTAIL ADMIN','PayloadDescription':'BALI COCKTAIL administrator v3','Label':'BALI COCKTAIL ADMIN','URL':url,'IsRemovable':True,'Precomposed':True,'FullScreen':True,'IgnoreManifestScope':True,'Icon':icon}
          profile={'PayloadType':'Configuration','PayloadVersion':1,'PayloadIdentifier':'by.bali.cocktails.admin.mobile.profile.v7','PayloadUUID':str(uuid.uuid4()).upper(),'PayloadDisplayName':'BALI COCKTAIL ADMIN','PayloadDescription':'Устанавливает BALI COCKTAIL ADMIN v3 на экран Домой iPhone.','PayloadOrganization':'BALI','PayloadRemovalDisallowed':False,'PayloadContent':[clip]}
          with open('out/ios/BALI-COCKTAIL-ADMIN-iPhone-v3.mobileconfig','wb') as f: plistlib.dump(profile,f,fmt=plistlib.FMT_XML,sort_keys=False)
          PY
          plutil -lint out/ios/BALI-COCKTAIL-ADMIN-iPhone-v3.mobileconfig
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: cd mobile-admin-ios && xcodegen generate
      - name: Build iOS Simulator admin
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project mobile-admin-ios/BALI_COCKTAIL_ADMIN.xcodeproj -scheme BALI_COCKTAIL_ADMIN -sdk iphonesimulator -configuration Release -derivedDataPath mobile-admin-ios/build CODE_SIGNING_ALLOWED=NO build
          APP="$(find mobile-admin-ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" out/ios/BALI-COCKTAIL-ADMIN-iOS-Simulator.app.zip
      - uses: actions/upload-artifact@v4
        with: {name: BALI-COCKTAIL-ADMIN-iOS-v3-Unsigned, path: out/ios/BALI-COCKTAIL-ADMIN-iOS-Simulator.app.zip, if-no-files-found: error, retention-days: 30}
      - uses: actions/upload-artifact@v4
        with: {name: BALI-COCKTAIL-ADMIN-iPhone-v3-Profile, path: out/ios/BALI-COCKTAIL-ADMIN-iPhone-v3.mobileconfig, if-no-files-found: error, retention-days: 30}
