name: Package BALI COCKTAIL ADMIN v1.3 Browser

on:
  push:
    branches: [main]
    paths:
      - 'admin/**'
      - '.github/workflows/admin-package-v13.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JavaScript
        run: |
          node --check admin/print-tools.js
          node --check admin/bar-menu.js
          node --check admin/products-a4.js
          node --check admin/document-print.js
          node --check admin/publish-fix.js
      - name: Prepare package
        run: |
          set -euo pipefail
          mkdir -p out/BALI-COCKTAIL-ADMIN
          cp admin/index.html admin/print-tools.js admin/bar-menu.js admin/products-a4.js admin/document-print.js admin/publish-fix.js out/BALI-COCKTAIL-ADMIN/
          python3 - <<'PY'
          from pathlib import Path
          p=Path('out/BALI-COCKTAIL-ADMIN/index.html')
          s=p.read_text(encoding='utf-8')
          scripts='''<script src="print-tools.js"></script>\n<script src="bar-menu.js"></script>\n<script src="products-a4.js"></script>\n<script src="document-print.js"></script>\n<script src="publish-fix.js"></script>\n'''
          s=s.replace('</body>',scripts+'</body>')
          p.write_text(s,encoding='utf-8')
          PY
          cat > out/BALI-COCKTAIL-ADMIN/README.txt <<'TXT'
          BALI COCKTAIL ADMIN v1.3
          Откройте index.html в Chrome или Edge.
          Новое: печать выбранной продукции A4 с ценами BYN; техкарты для бармена; документальные техкарты A4; исправленная публикация GitHub Contents API.
          TXT
          cd out && zip -r BALI-COCKTAIL-ADMIN-v1.3-Browser.zip BALI-COCKTAIL-ADMIN
      - name: Upload browser admin
        uses: actions/upload-artifact@v4
        with:
          name: BALI-COCKTAIL-ADMIN-v1.3-Browser
          path: out/BALI-COCKTAIL-ADMIN-v1.3-Browser.zip
          if-no-files-found: error
          retention-days: 30
