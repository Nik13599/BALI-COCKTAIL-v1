name: Build BALI COCKTAIL v1

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Generate application sources
        shell: bash
        run: |
          cat scripts/bootstrap.part.* > /tmp/bootstrap.sh
          chmod +x /tmp/bootstrap.sh
          /tmp/bootstrap.sh generated
          chmod +x scripts/apply-overrides.sh scripts/android-smoke.sh
          scripts/apply-overrides.sh generated
      - name: Apply canonical BALI COCKTAIL icon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p generated/android/app/src/main/res/drawable
          cp branding/app-icon.png generated/android/app/src/main/res/drawable/ic_launcher.png
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: actions/cache@v4
        with: {path: ~/.android/debug.keystore, key: bali-cocktail-v1-debug-keystore}
      - name: Create stable Android signing key when missing
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=BALI,C=BY" -keyalg RSA -keysize 2048 -validity 10000; fi
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '9.1.0'}
      - name: Build APK
        run: gradle -p generated/android :app:assembleDebug --stacktrace
      - name: Verify APK contents
        shell: bash
        run: |
          APK=generated/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          unzip -l "$APK" >/tmp/apk-files.txt
          grep -q 'assets/cocktails.json' /tmp/apk-files.txt
      - name: Enable KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/android-smoke.sh
      - name: Prepare Android installer
        run: |
          mkdir -p out/android
          cp generated/android/app/build/outputs/apk/debug/app-debug.apk out/android/BALI-COCKTAIL-v1.apk
      - uses: actions/upload-artifact@v4
        with: {name: BALI-COCKTAIL-v1-Android-APK, path: out/android/BALI-COCKTAIL-v1.apk, if-no-files-found: error, retention-days: 30}

  ios-unsigned:
    name: iOS unsigned build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Generate application sources
        shell: bash
        run: |
          cat scripts/bootstrap.part.* > /tmp/bootstrap.sh
          chmod +x /tmp/bootstrap.sh
          /tmp/bootstrap.sh generated
          chmod +x scripts/apply-overrides.sh
          scripts/apply-overrides.sh generated
      - name: Prepare iOS assets with canonical BALI icon
        shell: bash
        run: |
          set -euo pipefail
          IOS_DIR="generated/ios/BALI_COCKTAIL"; ASSETS="$IOS_DIR/Assets.xcassets"
          rm -rf "$ASSETS"/cocktail_*.imageset "$ASSETS"/classic_*.imageset "$ASSETS"/tiki_*.imageset
          mkdir -p "$ASSETS/AppIcon.appiconset"
          printf '%s\n' '{"info":{"author":"xcode","version":1}}' > "$ASSETS/Contents.json"
          cp data/cocktails.json "$IOS_DIR/cocktails.json"
          cp branding/app-icon.png "$ASSETS/AppIcon.appiconset/appicon-1024.png"
          sips -z 120 120 "$ASSETS/AppIcon.appiconset/appicon-1024.png" --out "$ASSETS/AppIcon.appiconset/appicon-120.png" >/dev/null
          sips -z 180 180 "$ASSETS/AppIcon.appiconset/appicon-1024.png" --out "$ASSETS/AppIcon.appiconset/appicon-180.png" >/dev/null
          sips -z 152 152 "$ASSETS/AppIcon.appiconset/appicon-1024.png" --out "$ASSETS/AppIcon.appiconset/appicon-152.png" >/dev/null
          sips -z 167 167 "$ASSETS/AppIcon.appiconset/appicon-1024.png" --out "$ASSETS/AppIcon.appiconset/appicon-167.png" >/dev/null
          cat > "$ASSETS/AppIcon.appiconset/Contents.json" <<'JSON'
          {"images":[{"filename":"appicon-120.png","idiom":"iphone","scale":"2x","size":"60x60"},{"filename":"appicon-180.png","idiom":"iphone","scale":"3x","size":"60x60"},{"filename":"appicon-152.png","idiom":"ipad","scale":"2x","size":"76x76"},{"filename":"appicon-167.png","idiom":"ipad","scale":"2x","size":"83.5x83.5"},{"filename":"appicon-1024.png","idiom":"ios-marketing","scale":"1x","size":"1024x1024"}],"info":{"author":"xcode","version":1}}
          JSON
      - run: brew install xcodegen
      - run: cd generated/ios && xcodegen generate
      - name: Build iOS Simulator app
        shell: bash
        run: |
          xcodebuild -project generated/ios/BALI_COCKTAIL.xcodeproj -scheme BALI_COCKTAIL -sdk iphonesimulator -configuration Release -derivedDataPath generated/ios/build CODE_SIGNING_ALLOWED=NO build
          APP="$(find generated/ios/build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' -print -quit)"
          test -n "$APP"
          mkdir -p out/ios
          ditto -c -k --sequesterRsrc --keepParent "$APP" out/ios/BALI-COCKTAIL-v1-iOS-Simulator.app.zip
      - uses: actions/upload-artifact@v4
        with: {name: BALI-COCKTAIL-v1-iOS-Unsigned, path: out/ios/BALI-COCKTAIL-v1-iOS-Simulator.app.zip, if-no-files-found: error, retention-days: 30}
